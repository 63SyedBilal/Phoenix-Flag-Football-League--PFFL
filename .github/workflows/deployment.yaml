name: Deploy PFFL Backend 

on:
  push:
    branches:
      - bilalphoenix
      - main
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Deploy Staging
    if: github.ref == 'refs/heads/bilalphoenix'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Bilal Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 3.236.28.26
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_STAGING }}
          port: 22
          script: |
            cd /home/ubuntu/pfflbackendbilal
            git pull origin bilalphoenix
            npm install --save-dev typescript @types/react @types/node
            npm run build
            pm2 delete pffl-backend || true
            pm2 start "npm run start" --name pffl-backend
            pm2 save

  deploy-prod:
    name: Deploy Main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: SSH into Main Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 100.24.126.221
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          port: 22
          script: |
            # --- MAIN DEPLOYMENT LOGIC ---
            # Update this path to your production folder
            cd /home/ubuntu/pfflbackend-main 
            
            git pull origin main
            
            # Standard install for main (usually --production)
            npm install 
            npm run build
            
            # Ensure the PM2 name is distinct if on the same server
            pm2 delete pffl-backend-main || true
            pm2 start "npm run start" --name pffl-backend-main
            pm2 save
